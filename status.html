  .status-done        { background: #e8f5e9; border-color: #2e7d32; color: #1b5e20; }
  .status-in_progress { background: #fff8e1; border-color: #f9a825; color: #8d6e00; }

  svg .node rect.status-done        { fill: #e8f5e9; stroke: #2e7d32; }
  svg .node rect.status-in_progress { fill: #fff8e1; stroke: #f9a825; }
  svg .node rect.status-todo        { fill: #f5f5f5; stroke: #9e9e9e; }
  svg .node rect.status-human_gated { fill: #ede7f6; stroke: #5e35b1; }
  svg .node rect.status-descoped    { fill: #ffebee; stroke: #c62828; }
  svg .node.is-descoped text { text-decoration: line-through; fill: #b71c1c; }
  svg .node rect { stroke-width: 2; }
  svg .node rect.is-ready { stroke: #1565c0; stroke-width: 4; }
  svg .node rect.is-blocked { stroke-dasharray: 6 3; }
  svg .node text { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1d2129; }
  svg .edge { fill: none; stroke: #b0bec5; stroke-width: 1.5; }
  svg .node.hl rect { stroke-width: 4; }
  svg .edge.hl { stroke: #1d2129; stroke-width: 2.5; }
  .phase-list h2 { font-size: 15px; margin: 20px 0 6px; }
  .phase-list li { margin: 6px 0; }
  .phase-list .chip { font-size: 11px; padding: 0 6px; margin-left: 8px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
  .phase-list ol, ol.legacy { padding-left: 28px; }
  ol.legacy li { margin: 6px 0; }

in state and owned by nobody, which is what the env exclusion is for. A structural pin over `infrastructure/cloud-run/*/` would have caught the original miss on 2026-09-03. `roles/editor` measured: nothing runs as the default compute account, but Cloud Build does, so revoking it would break source deploys for three services — recommendation recorded, not acted on. Dataset-level grants and the break-glass secret decision named as outstanding. **Un-gated**: no review instruments run."},{"id":"14.6","phase":14,"status":"done","deps":[],"text":"**[14.6]** Session key resolved so the warehouse holds real visitors: `session_id` is reserved in gtag.js, which consumes it before the hit is built, so every real-browser row reaches `iampatterson_raw.events_raw` with it NULL while the generator — hand-building its query string against the same `/g/collect` endpoint — sets it explicitly; all twelve Dataform models keyed on that column and `stg_sessions` filtered `WHERE session_id IS NOT NULL`, so the session layer held 193,323 sessions of which zero were real and every mart and Metabase dashboard above it described the generator alone; resolve `COALESCE(iap_session_id, session_id)` at the staging boundary in the passthrough column, the dedup partition and the `event_id` hash, matching the precedence `pubsub-tag-template.js` already uses so the warehouse and the real-time overlay key a visitor identically; fix `is_synthetic`, which derived from `iap_source` that the real site also sends and therefore labelled every recovered visitor synthetic, by having the generator send its own `iap_synthetic` marker with its user agent as the fallback for rows already in the sixty-day raw window; and replace the `assert_stg_sessions` null check — which tested a predicate `stg_sessions` itself filters out and so could never fail — with one that asserts non-synthetic sessions exist, plus a generic check that no assertion tests a null its source model removes `[deps: none]` ✅ 2026-09-08, session-2026-09-08-002, commits `a6ff68b` and `e02674d` (resolved key measured against live: 12 distinct real sessions over two days where there were 0, generator sessions unchanged; both review instruments run, and both independently found the `is_synthetic` mislabel that would have shipped a permanently red assertion. **Open**: the marts carry the fix only after this merges, the sync action mirrors to the `dataform` branch and the scheduled run rebuilds; the RAG snapshot tables must be re-run after that; history before ~2026-07-10 is past the 60-day raw partition expiry and unrecoverable)"}],"frontier":{"in_progress":[],"ready":[],"blocked":[],"serial":null}}
</script>
<script>
(function () {
  'use strict';
  var root = document.getElementById('root');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // The five-status vocabulary, labeled once — legend chips and phase-list
  // chips must read identically ([26.2]). An out-of-vocabulary status
  // degrades to its underscore-spaced word rather than disappearing.
  var STATUS_LABEL = { done: 'done', in_progress: 'in progress', todo: 'todo',
                       human_gated: 'human-gated', descoped: 'descoped' };
  function label(s) { return STATUS_LABEL[s] || String(s).replace('_', ' '); }

  function fail(msg) {
    root.insertBefore(el('div', 'error', msg), root.firstChild);
  }

  var data;
  try {
    data = JSON.parse(document.getElementById('status-data').textContent);
  } catch (e) {
    fail('The embedded status JSON failed to parse: ' + e.message);
    return;
  }

  // Frontier strip — field for field what the resolver reported. In LEGACY
  // mode the ID-list fields are empty by definition (no IDs exist), so the
  // strip shows only the one real signal — the next line of work — instead
  // of three dashes.
  function renderStrip(data) {
    var f = data.frontier || {};
    var strip = document.getElementById('frontier');
    function grp(label, value) {
      var g = el('span', 'grp');
      g.appendChild(el('span', 'lbl', label));
      g.appendChild(el('span', '', value));
      strip.appendChild(g);
    }
    if (data.mode === 'LEGACY') {
      grp('next:', f.serial === null || f.serial === undefined ? '—' : String(f.serial));
      return;
    }
    grp('in progress:', (f.in_progress || []).join(', ') || '—');
    grp('ready:', (f.ready || []).join(', ') || '—');
    grp('blocked:', (f.blocked || []).map(function (b) {
      return b.id + ' ← ' + b.blocked_by;
    }).join(', ') || '—');
    grp('serial:', f.serial === null || f.serial === undefined ? '—' : String(f.serial));
  }

  // Legend — the status vocabulary applies in both modes; the frontier
  // distinctions exist only where there is a graph to mark.
  function buildLegend(withFrontier) {
    var legend = el('div', '', '');
    legend.id = 'legend';
    var chips = ['done', 'in_progress', 'todo', 'human_gated', 'descoped']
      .map(function (s) { return ['status-' + s, label(s)]; });
    if (withFrontier) {
      chips.push(['status-todo is-ready', 'ready frontier']);
      chips.push(['status-todo is-blocked', 'blocked']);
    }
    chips.forEach(function (pair) {
      legend.appendChild(el('span', 'chip ' + pair[0], pair[1]));
    });
    root.appendChild(legend);
  }

  // EVERYTHING that touches the parsed data renders inside one guard — a
  // throw anywhere (meta, strip, graph) lands as a visible banner, never a
  // silently truncated page. Shape-gate-passing garbage in any field is
  // hand-fed-only input, but it still fails loud here.
  try {
    document.getElementById('meta').textContent =
      'mode ' + data.mode +
      (data.phase !== null && data.phase !== undefined ? ' · phase ' + data.phase : '') +
      ' · generated ' + data.generated;
    renderStrip(data);
    if (data.mode === 'LEGACY') renderLegacy(data); else renderDag(data);
  } catch (e) {
    fail('Render failed: ' + e.message);
  }

  // LEGACY: no IDs, empty deps — a plain ordered list in document order.
  // There are no edges to draw, and none are invented.
  function renderLegacy(data) {
    buildLegend(false);
    var list = document.createElement('ol');
    list.className = 'legacy';
    data.deliverables.forEach(function (d) {
      var li = el('li', 'status-' + d.status);
      li.appendChild(el('span', '', d.text));
      list.appendChild(li);
    });
    root.appendChild(list);
  }

  function renderDag(data) {
    var SVG_NS = 'http://www.w3.org/2000/svg';
    var items = data.deliverables;
    if (!items.length) {
      // Unreachable via the producer (the resolver refuses bullet-free
      // trackers), so hand-fed input gets a loud banner, not broken geometry.
      fail('The status JSON carries no deliverables — nothing to draw.');
      return;
    }
    var byId = {};
    items.forEach(function (d) { byId[d.id] = d; });
    var ready = {};
    (data.frontier.ready || []).forEach(function (id) { ready[id] = true; });
    var blocked = {};
    (data.frontier.blocked || []).forEach(function (b) { blocked[b.id] = true; });

    // Topological layer = longest dependency chain beneath the node. The
    // resolver guarantees acyclicity (it exits 5 on cycles); the visiting
    // guard turns hand-fed cyclic JSON into a loud banner, not a hung page.
    var memo = {}, visiting = {};
    function depth(id) {
      if (memo[id] !== undefined) return memo[id];
      if (visiting[id]) throw new Error('dependency cycle at ' + id);
      visiting[id] = true;
      var best = 0;
      (byId[id].deps || []).forEach(function (p) {
        if (byId[p]) best = Math.max(best, depth(p) + 1);
      });
      delete visiting[id];
      memo[id] = best;
      return best;
    }
    var layers = [];
    items.forEach(function (d) {
      var n = depth(d.id);
      (layers[n] = layers[n] || []).push(d);   // document order within a layer
    });

    // Hand-rolled geometry: layers as columns, document order as rows.
    var NW = 96, NH = 34, CGAP = 70, RGAP = 16, M = 24;
    var rows = 0;
    layers.forEach(function (l) { rows = Math.max(rows, l.length); });
    var width = M * 2 + layers.length * NW + (layers.length - 1) * CGAP;
    var height = M * 2 + rows * NH + (rows - 1) * RGAP;
    var pos = {};
    layers.forEach(function (layer, li) {
      layer.forEach(function (d, ri) {
        pos[d.id] = { x: M + li * (NW + CGAP), y: M + ri * (NH + RGAP) };
      });
    });

    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.setAttribute('role', 'img');

    // Edges first (under the nodes), one per declared dependency.
    var edges = [];
    items.forEach(function (d) {
      (d.deps || []).forEach(function (p) {
        if (!byId[p]) return;
        var a = pos[p], b = pos[d.id];
        var path = document.createElementNS(SVG_NS, 'path');
        var x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
        var mx = (x1 + x2) / 2;
        path.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 +
          ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2);
        path.setAttribute('class', 'edge');
        path.dataset.from = p;
        path.dataset.to = d.id;
        svg.appendChild(path);
        edges.push(path);
      });
    });

    var nodeEls = {};
    items.forEach(function (d) {
      var p = pos[d.id];
      var g = document.createElementNS(SVG_NS, 'g');
      g.setAttribute('class', 'node' + (d.status === 'descoped' ? ' is-descoped' : ''));
      var rect = document.createElementNS(SVG_NS, 'rect');
      rect.setAttribute('x', p.x); rect.setAttribute('y', p.y);
      rect.setAttribute('width', NW); rect.setAttribute('height', NH);
      rect.setAttribute('rx', 6);
      rect.setAttribute('class', 'status-' + d.status + (ready[d.id] ? ' is-ready' : '') +
        (blocked[d.id] ? ' is-blocked' : ''));
      var label = document.createElementNS(SVG_NS, 'text');
      label.setAttribute('x', p.x + NW / 2); label.setAttribute('y', p.y + NH / 2 + 5);
      label.setAttribute('text-anchor', 'middle');
      label.textContent = d.id;
      var title = document.createElementNS(SVG_NS, 'title');
      title.textContent = d.text;
      g.appendChild(title); g.appendChild(rect); g.appendChild(label);
      svg.appendChild(g);
      nodeEls[d.id] = g;
      g.addEventListener('mouseenter', function () { highlight(d.id, true); });
      g.addEventListener('mouseleave', function () {
        highlight(d.id, false);
        if (pinnedId) highlight(pinnedId, true);
      });
      // Click pins the chain (the touch path); clicking the pinned node
      // again releases it. Tab reaches every node, focus traces like hover,
      // and Enter/Space pin like click — the keyboard path.
      g.addEventListener('click', function () { setPin(d.id); });
      g.setAttribute('tabindex', '0');
      g.addEventListener('focus', function () { highlight(d.id, true); });
      g.addEventListener('blur', function () {
        highlight(d.id, false);
        if (pinnedId) highlight(pinnedId, true);
      });
      g.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); setPin(d.id); }
      });
    });

    var pinnedId = null;
    function setPin(id) {
      if (pinnedId) highlight(pinnedId, false);
      pinnedId = (pinnedId === id) ? null : id;
      if (pinnedId) highlight(pinnedId, true);
    }

    // Blocked chains traceable: hovering a node lights its transitive
    // dependency closure — every ancestor node and every edge between them.
    function ancestors(id, acc) {
      (byId[id].deps || []).forEach(function (p) {
        if (byId[p] && !acc[p]) { acc[p] = true; ancestors(p, acc); }
      });
      return acc;
    }
    function highlight(id, on) {
      var chain = ancestors(id, {}); chain[id] = true;
      Object.keys(chain).forEach(function (n) {
        if (nodeEls[n]) nodeEls[n].classList.toggle('hl', on);
      });
      edges.forEach(function (e) {
        if (chain[e.dataset.to] && chain[e.dataset.from]) e.classList.toggle('hl', on);
      });
    }

    buildLegend(true);
    root.appendChild(svg);

    // Per-phase detail: the full deliverable text beside the graph, grouped
    // by the phase boundaries the JSON carries. ([6.6]'s deferral revisited
    // here, as recorded: `phases` is derived from deliverable IDs, so a
    // planned-but-empty phase section has no entry in the JSON and is
    // omitted from this view — accepted; the tracker itself remains where a
    // deliverable-less phase is visible, and the JSON contract is unchanged.)
    var detail = el('div', 'phase-list');
    (data.phases || []).forEach(function (ph) {
      detail.appendChild(el('h2', '', 'Phase ' + ph));
      var list = document.createElement('ol');
      items.forEach(function (d) {
        if (d.phase !== ph) return;
        var li = el('li', '');
        li.appendChild(el('span', '', d.text));
        var chip = el('span', 'chip status-' + d.status + (ready[d.id] ? ' is-ready' : ''),
          label(d.status) + (ready[d.id] ? ' · ready' : ''));
        li.appendChild(chip);
        list.appendChild(li);
      });
      detail.appendChild(list);
    });
    root.appendChild(detail);
  }
})();
</script>
