name: infra-terraform

# Phase 11 D9 — Terraform CI/CD for the GCP infrastructure-as-code.
# - PRs touching infrastructure/terraform/**: fmt + validate (no auth) then a
#   WIF-authed `terraform plan` posted back as a PR comment.
# - Push to main: `terraform apply` behind the `infra-production` environment.
#   The apply job's first step VERIFIES that environment carries protection
#   rules and exits 1 if it does not — this file used to assert the safeguard in
#   a comment instead, and the assertion was measured false on 2026-09-08.
#
# Auth is via Workload Identity Federation — no service-account JSON key in repo
# secrets. PREREQUISITE: a WIF pool/provider + a deployer service account must
# exist, and these repo-level variables set:
#   vars.GCP_WIF_PROVIDER  (projects/NNN/locations/global/workloadIdentityPools/POOL/providers/PROVIDER)
#   vars.GCP_DEPLOYER_SA   (deployer@iampatterson.iam.gserviceaccount.com)
# The WIF resources themselves are a follow-up to add as Terraform (see README).

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/infra-terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/infra-terraform.yml'

permissions:
  contents: read
  id-token: write # Workload Identity Federation
  pull-requests: write # post the plan as a PR comment

env:
  TF_VERSION: '1.15.5'
  TF_WORKING_DIR: infrastructure/terraform

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform fmt
        run: terraform -chdir=$TF_WORKING_DIR fmt -check -recursive
      - name: terraform init (no backend — validate needs no credentials)
        run: terraform -chdir=$TF_WORKING_DIR init -backend=false -input=false
      - name: terraform validate
        run: terraform -chdir=$TF_WORKING_DIR validate

  plan:
    name: plan (PR)
    # Skipped until Workload Identity Federation is configured (repo var
    # GCP_WIF_PROVIDER set). Until then the fmt+validate job is the PR gate.
    if: github.event_name == 'pull_request' && vars.GCP_WIF_PROVIDER != ''
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init
        run: terraform -chdir=$TF_WORKING_DIR init -input=false
      - name: terraform plan
        id: plan
        run: terraform -chdir=$TF_WORKING_DIR plan -input=false -no-color
        continue-on-error: true
      - name: Post plan to PR
        uses: actions/github-script@v7
        # Plan output and outcome reach the script through env, never through
        # ${{ }} interpolation into the source. A pull request controls the .tf
        # files, therefore controls the plan text, therefore controlled the
        # JavaScript this step used to compile — an expression-injection sink
        # holding a pull-requests:write token. A backtick or ${ in plan output
        # was also enough to break the step outright and silently drop the
        # comment.
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const body = [
              '#### terraform plan — `' + process.env.TF_WORKING_DIR + '`',
              'Outcome: `' + process.env.PLAN_OUTCOME + '`',
              '',
              '<details><summary>Plan output</summary>',
              '',
              '```',
              (process.env.PLAN_STDOUT || '').slice(0, 60000),
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: apply (main)
    # Skipped until Workload Identity Federation is configured (repo var
    # GCP_WIF_PROVIDER set). Live applies run from a workstation until then.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    needs: validate
    runs-on: ubuntu-latest
    environment: infra-production
    steps:
      # DELIBERATELY THE FIRST STEP. It needs no working tree — it calls the
      # API with github.token — so nothing is fetched and no credential is
      # minted before the environment is confirmed to require a human.
      #
      # It checks for a REQUIRED REVIEWER, not for "some protection rule".
      # `.protection_rules | length` counts wait timers and branch policies too,
      # so an environment carrying only a wait timer reports 1, the guard prints
      # a reassuring count, and the apply proceeds with nobody reviewing it —
      # the exact state this deliverable exists to prevent, passing the check
      # written to prevent it.
      #
      # A 404 and an unreadable response are different diagnoses, and both fail
      # closed; only the message differs, so an operator debugging a blocked
      # apply is not told the environment is missing when a token scope changed.
      - name: refuse an unprotected environment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          status=$(gh api "repos/$REPO/environments/infra-production" \
                     --silent -i 2>/dev/null | head -1 | awk '{print $2}')
          if [ "$status" = "404" ]; then
            echo "::error::infra-production does not exist — GitHub creates a referenced-but-missing environment implicitly and UNPROTECTED"
            exit 1
          fi
          reviewers=$(gh api "repos/$REPO/environments/infra-production" \
                        --jq '[.protection_rules[] | select(.type=="required_reviewers")] | length' \
                        2>/dev/null || echo "unreadable")
          if [ "$reviewers" = "unreadable" ]; then
            echo "::error::could not read infra-production (HTTP ${status:-unknown}) — refusing to apply without confirming a required reviewer"
            exit 1
          fi
          if [ "$reviewers" -eq 0 ]; then
            echo "::error::infra-production carries no required-reviewer rule; an apply here would be unreviewed even if other protection rules exist"
            exit 1
          fi
          echo "infra-production carries $reviewers required-reviewer rule(s)."

      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init
        run: terraform -chdir=$TF_WORKING_DIR init -input=false
      - name: terraform apply
        run: terraform -chdir=$TF_WORKING_DIR apply -input=false -auto-approve
